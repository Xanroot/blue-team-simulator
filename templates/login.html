<!DOCTYPE html>
<html>

<head>

    <title>ATT&CK Story Mode</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="login-body">

<div class="login-container">

    <div class="terminal-header">

        <span class="dot blue"></span>
        <span class="dot green"></span>
        <span class="dot cyan"></span>

        <span class="terminal-title">

            soc_defender_console.sh

        </span>

    </div>

    <div class="login-box">

        <div class="soc-badge">

            🛡 BLUE TEAM OPERATIONS

        </div>

        <h1 class="glow-title">

            ATT&CK Story Mode

        </h1>

        <p class="login-subtitle">

            SOC Investigation & MITRE ATT&CK Simulation Platform

        </p>

        <div class="terminal-line">

            > SECURITY OPERATIONS ACCESS REQUIRED

        </div>

        <div class="terminal-line-small">

            Threat Monitoring • Incident Response • Threat Hunting

        </div>

        <input
            type="password"
            id="access-key"
            placeholder="ENTER ANALYST ACCESS KEY">

        <button onclick="authenticate()">

            ENTER SOC CONSOLE

        </button>

        <p class="demo-access">

            Demo Access Key:
            <span>blue-team</span>

        </p>

        <p id="status-text"></p>

    </div>

</div>

<script>

function authenticate() {

    let key =
        document.getElementById(
            "access-key"
        ).value;

    let status =
        document.getElementById(
            "status-text"
        );

    if (key === "blue-team") {

        status.innerHTML =
            "✅ ACCESS GRANTED";

        status.style.color =
            "#22c55e";

        setTimeout(() => {

            window.location.href =
                "/dashboard";

        }, 1200);

    }

    else {

        status.innerHTML =
            "❌ INVALID ACCESS KEY";

        status.style.color =
            "#ef4444";

    }

}

</script>

</body>
</html>
